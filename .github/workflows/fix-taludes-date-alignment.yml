name: Fix Taludes date alignment

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/scripts/fix_taludes_date_alignment.py
      - .github/workflows/fix-taludes-date-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply alignment fix
        run: python .github/scripts/fix_taludes_date_alignment.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/components/taludes/polygon-editor-pro.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(taludes): keep date numbers aligned inside card"
          git push origin Apont-Auto
