name: Apply duplicate protection for daily correctives

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/apply-prevent-duplicate-daily-correctives.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apont-Auto
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply requested behavior
        run: python .github/patch_prevent_duplicate_daily_correctives.py

      - name: Verify source rule
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/features/relatorio-diario/daily-execution-report.tsx').read_text(encoding='utf-8')
          assert 'buildCorrectiveExecutionByOs' in text
          assert 'Já adicionada ao relatório' in text
          assert 'Já adicionada em ${formatDateBr(historicalRecord.atividade_data)}' in text
          assert 'const previousExecution = correctiveExecutionByOs.get(correctiveOsKey(row.os));' in text
          assert 'error?.code === "23505"' in text
          assert 'historicalRecord ? (' in text
          print('Persistent duplicate protection verified in source.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Related tests
        run: npx vitest run src/features/relatorio-diario/lib/daily-maintenance.test.ts

      - name: Commit implementation and clean temporary files
        run: |
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/relatorio-diario/daily-execution-report.tsx
          git rm .github/patch_prevent_duplicate_daily_correctives.py .github/workflows/apply-prevent-duplicate-daily-correctives.yml
          git commit -m "Impede corretivas duplicadas no relatório diário"
          git push origin HEAD:Apont-Auto
