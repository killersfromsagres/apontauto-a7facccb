name: Fix legal automatic next date

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/fix-legal-auto-next-date.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply fix
        run: python .github/scripts/fix_legal_auto_next_date.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Commit fix
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/routes/_authenticated/painel-legal.tsx
          git commit -m "fix(legal): auto-fill next execution date"
          git push origin HEAD:Apont-Auto
