name: Validate materials upgrade

on:
  push:
    branches:
      - Apont-Auto
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-materials-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
