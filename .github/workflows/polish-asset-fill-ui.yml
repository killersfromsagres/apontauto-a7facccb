name: Polish asset fill premium UI

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/polish-asset-fill-ui.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply final visual polish
        shell: python
        run: |
          from pathlib import Path

          css = Path('public/inteligencia-ativos-preencher-premium.css')
          css_text = css.read_text(encoding='utf-8')
          addition = r'''

/* Normaliza os GlassCard globais nesta experiência para um visual mais sóbrio. */
[data-page-title="Preencher Planilha"] .glass-surface,
[data-page-title="Preencher Planilha"] .glass-block {
  border: 1px solid var(--asset-border) !important;
  border-radius: 1.05rem !important;
  background: linear-gradient(180deg, color-mix(in oklch, var(--card) 92%, white 1%), color-mix(in oklch, var(--card) 97%, black 3%)) !important;
  box-shadow: 0 16px 44px -38px rgb(0 0 0 / 0.72), inset 0 1px 0 rgb(255 255 255 / 0.03) !important;
}

[data-page-title="Preencher Planilha"] .glass-surface:hover,
[data-page-title="Preencher Planilha"] .glass-block:hover {
  border-color: color-mix(in oklch, var(--primary) 20%, var(--border)) !important;
  box-shadow: 0 18px 48px -40px rgb(0 0 0 / 0.78), inset 0 1px 0 rgb(255 255 255 / 0.04) !important;
}

[data-page-title="Preencher Planilha"] .glass-surface.card-sheen::after,
[data-page-title="Preencher Planilha"] .glass-block.card-sheen::after {
  display: none !important;
}

[data-page-title="Preencher Planilha"] .glass-surface > .pointer-events-none.absolute.inset-0,
[data-page-title="Preencher Planilha"] .glass-block > .pointer-events-none.absolute.inset-0 {
  opacity: 0.22 !important;
}

/* Toda ação primária do fluxo segue o mesmo botão moderno do upload. */
[data-page-title="Preencher Planilha"] button.bg-primary {
  border: 1px solid color-mix(in oklch, var(--primary) 58%, white 7%) !important;
  border-radius: 0.82rem !important;
  background: linear-gradient(135deg, color-mix(in oklch, var(--primary) 92%, white 8%), color-mix(in oklch, var(--primary) 90%, black 10%)) !important;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.16), 0 12px 28px -23px color-mix(in oklch, var(--primary) 66%, transparent) !important;
}

[data-page-title="Preencher Planilha"] button.bg-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.2), 0 16px 34px -23px color-mix(in oklch, var(--primary) 72%, transparent) !important;
}
'''
          if 'Normaliza os GlassCard globais nesta experiência' not in css_text:
              css.write_text(css_text.rstrip() + addition + '\n', encoding='utf-8')

          route = Path('src/routes/_authenticated/inteligencia-ativos.preencher.tsx')
          text = route.read_text(encoding='utf-8')
          old = 'className="bg-primary text-primary-foreground shadow-[0_0_15px_-3px_oklch(0.85_0.12_220/0.4)] hover:shadow-[0_0_20px_-3px_oklch(0.85_0.12_220/0.5)] transition-all"'
          new = 'className="asset-fill-primary-action text-primary-foreground transition-all"'
          if old in text:
              text = text.replace(old, new, 1)
          route.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add public/inteligencia-ativos-preencher-premium.css src/routes/_authenticated/inteligencia-ativos.preencher.tsx
          git commit -m "style(assets): complete minimal fill UI polish"
          git push origin HEAD:Apont-Auto
