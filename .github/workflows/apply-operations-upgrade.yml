name: Apply operations upgrade

on:
  push:
    branches: [Apont-Auto]
    paths:
      - "scripts/apply-operations-upgrade.mjs"
      - ".github/workflows/apply-operations-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patches
        run: node scripts/apply-operations-upgrade.mjs
      - name: Commit upgraded modules
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Upgrade corrective priorities materials and weekly programming"
          git push origin HEAD:Apont-Auto
