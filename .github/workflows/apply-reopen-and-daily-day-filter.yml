name: Apply corrective reopen and daily day filter

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/apply-reopen-and-daily-day-filter.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://fbhpdqykoptxnrbdcspr.supabase.co
      VITE_SUPABASE_PROJECT_ID: fbhpdqykoptxnrbdcspr
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_660hxNRSWPXuCne6oba5iQ_5DEZthmB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply patch
        run: python .github/patch_reopen_and_daily_day_filter.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production build and route generation
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Targeted regression tests
        run: npm test -- src/features/relatorio-diario/lib/weekly-planning.test.ts src/features/relatorio-diario/lib/weekly-planning-completed-day.test.ts src/features/relatorio-diario/lib/weekly-planning-completed-programmed.test.ts --passWithNoTests

      - name: Commit implementation
        run: |
          if git diff --quiet -- src/routes/_authenticated/corretiva-historico.tsx src/features/relatorio-diario/daily-execution-report.tsx src/features/relatorio-diario/lib/weekly-planning.ts src/features/relatorio-diario/lib/weekly-planning-completed-day.test.ts; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/corretiva-historico.tsx src/features/relatorio-diario/daily-execution-report.tsx src/features/relatorio-diario/lib/weekly-planning.ts src/features/relatorio-diario/lib/weekly-planning-completed-day.test.ts
          git commit -m "fix: reabrir corretivas e respeitar dia marcado no relatório"
          git push origin HEAD:Apont-Auto
