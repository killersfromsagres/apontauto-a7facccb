name: Add quick Backorder builder

on:
  push:
    branches: [Apont-Auto]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Integrate quick builder
        run: python .github/scripts/add_backorder_quick_builder.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/programacao.tsx
          if git diff --cached --quiet; then
            echo "No route changes to commit"
            exit 0
          fi
          git commit -m "feat(programacao): add quick Backorder spreadsheet builder"
          git push origin Apont-Auto
