name: Relocate Backorder builder

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/relocate-backorder-builder.yml
      - .github/scripts/relocate_backorder_builder.py

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply relocation
        run: python .github/scripts/relocate_backorder_builder.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/routes/_authenticated/programacao.tsx src/routes/_authenticated/corretiva-novo.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(corretiva): move Backorder builder to Corretiva Novo"
            git push origin Apont-Auto
          fi
