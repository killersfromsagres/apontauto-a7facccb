name: Ajustar metadados corretivas na programacao

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/fix-programacao-corretiva-meta.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Ajustar colunas G e J das corretivas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/preventiva/weekly-exporter.ts')
          text = path.read_text(encoding='utf-8')

          old = '''function taskValues(os: TriagedOS, ativoIndex: Map<string, AtivoIndexEntry>) {
            const isRefrigeracao = os.equipe.startsWith("CLIMAT");
            const entry = isRefrigeracao
              ? lookupAtivoEntry(ativoIndex, os.predio, os.andar, os.local)
              : undefined;
            return {
              os: os.os,
              nome: os.nomeOS,
              predio: os.predio,
              andar: os.andar,
              espaco: os.local,
              atividade: isCorrective(os) ? "Corretiva" : "Preventiva",
              sla: formatSLA(os.terminoSLA),
              equipe: os.equipe,
              ativo: isRefrigeracao
                ? entry?.ativo || os.ativo || "Ativo não localizado"
                : os.ativo || "",
              equipamento: isRefrigeracao
                ? os.equipamento || entry?.equipamento || ""
                : "",
            };
          }'''.replace('          ', '')

          new = '''function taskValues(os: TriagedOS, ativoIndex: Map<string, AtivoIndexEntry>) {
            const corrective = isCorrective(os);
            const isRefrigeracao = os.equipe.startsWith("CLIMAT");
            const entry = isRefrigeracao
              ? lookupAtivoEntry(ativoIndex, os.predio, os.andar, os.local)
              : undefined;
            return {
              os: os.os,
              nome: os.nomeOS,
              predio: os.predio,
              andar: os.andar,
              espaco: os.local,
              atividade: corrective ? "Corretiva" : "Preventiva",
              // Para corretivas, a coluna G exibe a data de abertura vinda de Corretiva-Novo.
              sla: formatSLA(corrective ? os.inicioSLA : os.terminoSLA),
              equipe: os.equipe,
              ativo: isRefrigeracao
                ? entry?.ativo || os.ativo || "Ativo não localizado"
                : os.ativo || "",
              // Para corretivas, a coluna J exibe o solicitante; preventivas preservam equipamento.
              equipamento: corrective
                ? os.solicitante || ""
                : isRefrigeracao
                  ? os.equipamento || entry?.equipamento || ""
                  : "",
            };
          }'''.replace('          ', '')

          if old not in text:
              raise SystemExit('Bloco taskValues esperado não encontrado; nenhuma alteração aplicada.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verificar diff
        run: |
          git diff --check
          git diff -- src/lib/preventiva/weekly-exporter.ts

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/lib/preventiva/weekly-exporter.ts
          git commit -m "fix(programacao): exibir abertura e solicitante das corretivas"
          git push origin HEAD:Apont-Auto
