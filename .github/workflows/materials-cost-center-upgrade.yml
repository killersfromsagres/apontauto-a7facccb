name: Validate materials cost center upgrade

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/materials-cost-center-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply materials upgrade
        run: python .github/scripts/upgrade_materials_cost_center.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/materiais/cost-center-mapping.ts src/lib/materiais/compras-premium-pdf.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat(materiais): resolve CC by asset prefix and include all PDF photos"
            git push origin HEAD:Apont-Auto
          fi
