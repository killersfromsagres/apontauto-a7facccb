name: Apply manual daily correctives

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/apply-manual-daily-correctives.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apont-Auto
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply requested behavior
        run: |
          python .github/patch_manual_daily_correctives.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/relatorio-diario/daily-execution-report.tsx')
          text = p.read_text(encoding='utf-8')
          block = '''      const freshPlanning = buildWeeklyPlanning({
                  scheduledRows: rows,
                  correctiveRows: freshPortfolio,
                  targetCorrectivesPerTeamPerDay: 1,
                });
          '''
          text = text.replace(block, '')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify rule in source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/features/relatorio-diario/daily-execution-report.tsx').read_text(encoding='utf-8')
          start = text.index('function buildDailyRows(')
          end = text.index('\nconst formatSourceStatus', start)
          block = text[start:end]
          assert 'scheduledCorrectives' not in block, 'Programmed correctives are still injected into daily rows'
          assert 'record.atividade_data !== date' in block, 'Daily corrective inclusion is not driven by execution records'
          assert 'Adicionar e concluir' in text, 'New action label missing'
          history = Path('src/routes/_authenticated/corretiva-historico.tsx').read_text(encoding='utf-8')
          assert 'Concluída via Relatório Diário' in history, 'History origin marker missing'
          print('Manual corrective rule verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Related tests
        run: npx vitest run src/features/relatorio-diario/lib/corrective-report.test.ts src/features/relatorio-diario/lib/daily-maintenance.test.ts src/features/relatorio-diario/lib/weekly-planning-completed-day.test.ts src/features/relatorio-diario/lib/weekly-planning-completed-programmed.test.ts src/lib/corretiva/historico-verificacao.test.ts

      - name: Commit implementation and clean temporary files
        run: |
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/relatorio-diario/daily-execution-report.tsx src/routes/_authenticated/corretiva-historico.tsx
          git rm .github/patch_manual_daily_correctives.py .github/workflows/apply-manual-daily-correctives.yml
          git commit -m "Corrige inclusão manual de corretivas no relatório diário"
          git push origin HEAD:Apont-Auto
