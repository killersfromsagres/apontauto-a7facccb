name: Verify asset fill repair

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/verify-asset-fill-fix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
