name: Apply Relatorio Diario support teams

on:
  push:
    branches:
      - fix/relatorio-diario-equipes-premium

permissions:
  contents: write

jobs:
  patch-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relatorio-diario-equipes-premium
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fix patch script compatibility
        run: sed -i 's/text = pattern.sub(new_function +/text = pattern.sub(lambda _: new_function +/' .github/scripts/apply_relatorio_equipes_premium.py

      - name: Apply report fixes
        run: python3 .github/scripts/apply_relatorio_equipes_premium.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Relatorio Diario
        run: bunx vitest run src/features/relatorio-diario

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Production build
        run: bun run build

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/relatorio-diario/lib/corrective-report.ts \
                  src/features/relatorio-diario/lib/corrective-report.test.ts \
                  src/routes/_authenticated/relatorio-diario.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: inclui equipes de apoio e refina PDF premium"
          git push origin HEAD:fix/relatorio-diario-equipes-premium
