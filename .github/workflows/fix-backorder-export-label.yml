name: Fix Backorder export label

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/fix-backorder-export-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0
      - name: Normalize label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/corretiva-novo.tsx')
          text = path.read_text(encoding='utf-8')
          old = '        "BACKORDERS · Todas as equipes",'
          new = '        "Todas as equipes",'
          if old not in text:
              raise SystemExit('Backorder export label not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/routes/_authenticated/corretiva-novo.tsx
          git commit -m "style(corretiva): clean Backorder export label"
          git push origin HEAD:Apont-Auto
