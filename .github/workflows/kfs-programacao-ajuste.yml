name: Ajuste fino Programacao

on:
  push:
    branches: [Apont-Auto]
    paths:
      - .github/workflows/kfs-programacao-ajuste.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Aplicar ajustes solicitados
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          polish = Path('src/lib/preventiva/weekly-export-polish.ts')
          text = polish.read_text(encoding='utf-8')

          marker = '''  // A data de Término SLA permanece sempre neutra. Nenhum destaque amarelo/vermelho
  // deve alcançar a coluna de data.
'''
          insert = '''  // Ajuste visual fixo solicitado para as linhas de dados.
  // ExcelJS usa pontos: 85.5 pt equivalem a 114 px em 96 DPI.
  row.height = 85.5;

  const osCell = row.getCell(COL.os);
  osCell.font = {
    ...(osCell.font ?? {}),
    size: 18,
  };

  const nomeCell = row.getCell(COL.nome);
  nomeCell.font = {
    ...(nomeCell.font ?? {}),
    size: 22,
  };

  for (const column of [COL.espaco, COL.ativo, COL.equipamento]) {
    const cell = row.getCell(column);
    cell.alignment = {
      ...(cell.alignment ?? {}),
      horizontal: "center",
      vertical: "middle",
      wrapText: true,
    };
  }

  // A data de Término SLA permanece sempre neutra. Nenhum destaque amarelo/vermelho
  // deve alcançar a coluna de data.
'''
          if text.count(marker) != 1:
              raise SystemExit(f'Marcador visual inesperado: {text.count(marker)} ocorrencias')
          text = text.replace(marker, insert, 1)

          old_height = '''  // Distribui melhor a altura disponível de cada página. Dias com poucas OS ficam
  // mais altos; dias cheios permanecem compactos o suficiente para caber em uma folha.
  if (isProgram) {
    readDaySections(sheet).forEach((section) => {
      const ideal = idealDailyRowHeight(section.rows.length);
      section.rows.forEach((row) => {
        row.height = Math.max(contentRowHeight(row), ideal);
      });
    });
  }
'''
          new_height = '''  // Altura fixa de 114 px (85.5 pt) para todas as linhas de dados da Programação.
  if (isProgram) {
    readDaySections(sheet).forEach((section) => {
      section.rows.forEach((row) => {
        row.height = 85.5;
      });
    });
  }
'''
          if text.count(old_height) != 1:
              raise SystemExit(f'Bloco de altura inesperado: {text.count(old_height)} ocorrencias')
          text = text.replace(old_height, new_height, 1)
          polish.write_text(text, encoding='utf-8')

          programacao = Path('src/routes/_authenticated/programacao.tsx')
          text = programacao.read_text(encoding='utf-8')
          old_name = '''          const monthSlug = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, "0")}`;
          const slotSlug = slot.id === "REFRIG" ? "REFRIGERACAO" : slot.id;
          const id = `${slot.id}-${periodStart}-${Date.now()}-${weekIndex}`;
          const item: GeneratedFile = {
            id,
            filename: `PROGRAMACAO_${monthSlug}_SEM${week.isoWeek}_${slotSlug}.xlsx`,
'''
          new_name = '''          const filenameBase =
            slot.id === "CCH"
              ? "Civil e Hidraulica"
              : slot.id === "REFRIG"
                ? "Refrigeracao"
                : "Eletrica";
          const fileStart = format(week.monday, "dd-MM-yyyy");
          const fileEnd = format(week.friday, "dd-MM-yyyy");
          const id = `${slot.id}-${periodStart}-${Date.now()}-${weekIndex}`;
          const item: GeneratedFile = {
            id,
            filename: `${filenameBase} SEMANA ${week.isoWeek} ${fileStart} a ${fileEnd}.xlsx`,
'''
          if text.count(old_name) != 1:
              raise SystemExit(f'Bloco de nome inesperado: {text.count(old_name)} ocorrencias')
          text = text.replace(old_name, new_name, 1)
          programacao.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Validar build
        run: bun run build

      - name: Commitar alteracoes
        shell: bash
        run: |
          git config user.name "KFS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/preventiva/weekly-export-polish.ts src/routes/_authenticated/programacao.tsx
          git commit -m "fix(programacao): ajustar altura fontes alinhamento e nomes"
          git push origin HEAD:Apont-Auto
