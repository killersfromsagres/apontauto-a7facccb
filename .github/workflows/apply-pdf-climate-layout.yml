name: Apply PDF climate layout

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/apply-pdf-climate-layout.yml

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apont-Auto
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply PDF patch
        run: python .github/patch_pdf_climate_layout.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/relatorio-diario/daily-execution-report.tsx
          git rm .github/patch_pdf_climate_layout.py .github/workflows/apply-pdf-climate-layout.yml
          git commit -m "Melhora layout e clima do PDF diário"
          git push origin HEAD:Apont-Auto
