name: Apply corrective operational export

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/patch_corretiva_operational_export.py
      - .github/workflows/apply-corretiva-operational-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apont-Auto
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply export changes
        run: python .github/patch_corretiva_operational_export.py

      - name: Verify source rules
        run: |
          grep -q 'Excel completo · Pendentes + Programados + Backorders' src/routes/_authenticated/corretiva-novo.tsx
          grep -q 'Peça solicitada?' src/lib/corretiva/programacao-excel.ts
          grep -q 'Está na programação?' src/lib/corretiva/programacao-excel.ts
          grep -q 'situacao_exportacao' src/lib/corretiva/programacao-excel.ts
          grep -q 'corretiva_pecas' src/routes/_authenticated/corretiva-novo.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Relevant tests
        run: npx vitest run src/lib/corretiva/programacao-excel-operacional.test.ts

      - name: Commit implementation and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/corretiva/programacao-excel.ts src/routes/_authenticated/corretiva-novo.tsx src/lib/corretiva/programacao-excel-operacional.test.ts
          git commit -m "feat: melhorar exportacao operacional de corretivas"
          echo "FUNCTIONAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rm .github/patch_corretiva_operational_export.py .github/workflows/apply-corretiva-operational-export.yml
          git commit -m "chore: remover validador temporario da exportacao"
          git push origin HEAD:Apont-Auto
