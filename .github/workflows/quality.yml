name: Temporary Taludes date visibility patch

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/quality.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 2

      - name: Add date visibility control
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/taludes/polygon-editor-pro.tsx")
          text = path.read_text(encoding="utf-8")

          if 'selected.data_visivel === false ? "Mostrar data" : "Ocultar data"' not in text:
              marker = '''              </div>\n            </AccordionSection>\n\n            <AccordionSection title="Aparência"'''
              replacement = '''              </div>\n              <Button\n                type="button"\n                variant="outline"\n                size="sm"\n                className="w-full gap-2 text-[10px]"\n                onClick={() =>\n                  void persistPatch(\n                    selected.id,\n                    { data_visivel: selected.data_visivel === false },\n                    selected.data_visivel === false ? "Data exibida no mapa" : "Data ocultada no mapa",\n                  )\n                }\n              >\n                {selected.data_visivel === false ? <EyeOff /> : <Eye />}\n                {selected.data_visivel === false ? "Mostrar data" : "Ocultar data"}\n              </Button>\n            </AccordionSection>\n\n            <AccordionSection title="Aparência"'''
              if marker not in text:
                  raise SystemExit("Marcador de Status e datas não encontrado; patch cancelado com segurança.")
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding="utf-8")

      - name: Restore quality workflow and commit feature
        run: |
          git show HEAD^:.github/workflows/quality.yml > .github/workflows/quality.yml
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/components/taludes/polygon-editor-pro.tsx .github/workflows/quality.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: adicionar botão para ocultar data do talude"
          git push origin HEAD:Apont-Auto
