name: Increase Taludes date font

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/scripts/increase_taludes_date_font.py
      - .github/workflows/increase-taludes-date-font.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply font adjustment
        run: python .github/scripts/increase_taludes_date_font.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --cache /tmp/apontauto-npm-cache --prefer-online --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/components/taludes/polygon-editor-pro.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style(taludes): increase date number size"
          git push origin Apont-Auto
