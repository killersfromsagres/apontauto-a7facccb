name: Patch backorder spreadsheet export

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/patch-backorder-spreadsheet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Add dedicated Backorder spreadsheet export
        shell: python
        run: |
          from pathlib import Path

          # --- Excel exporter ---
          path = Path('src/lib/corretiva/programacao-excel.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '  navySoft: argb("#173B5C"),\n  white: argb("#FFFFFF"),',
              '  navySoft: argb("#173B5C"),\n  backorderInk: argb("#2A0B10"),\n  backorderHeader: argb("#7F1D1D"),\n  backorderAccent: argb("#EF4444"),\n  white: argb("#FFFFFF"),'
            ),
            (
              '  tabColor: string,\n) {',
              '  tabColor: string,\n  reportTitle = "Programação de Corretivas",\n  backorderTheme = false,\n) {'
            ),
            (
              '  titleCell.value = `PROGRAMAÇÃO DE CORRETIVAS · ${teamLabel.toUpperCase()}`;\n  titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: C.ink } };',
              '  titleCell.value = `${reportTitle.toUpperCase()} · ${teamLabel.toUpperCase()}`;\n  titleCell.fill = {\n    type: "pattern",\n    pattern: "solid",\n    fgColor: { argb: backorderTheme ? C.backorderInk : C.ink },\n  };'
            ),
            (
              '    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: C.navySoft } };',
              '    cell.fill = {\n      type: "pattern",\n      pattern: "solid",\n      fgColor: { argb: backorderTheme ? C.backorderHeader : C.navySoft },\n    };'
            ),
            (
              '  aba: "corretiva" | "preventiva",\n  generatedAt = new Date(),',
              '  aba: "corretiva" | "preventiva" | "backorder",\n  generatedAt = new Date(),'
            ),
            (
              '  const title = aba === "preventiva" ? "Programação de Backorder" : "Programação de Corretivas";',
              '  const title =\n    aba === "backorder"\n      ? "Relatório de Backorders"\n      : aba === "preventiva"\n        ? "Programação de Backorder"\n        : "Programação de Corretivas";'
            ),
            (
              '    C.navySoft,\n  );\n\n  const usedNames = new Set(["Programação Geral"]);',
              '    aba === "backorder" ? C.backorderAccent : C.navySoft,\n    title,\n    aba === "backorder",\n  );\n\n  const usedNames = new Set(["Programação Geral"]);'
            ),
            (
              '      argb(palette.accent),\n    );\n  });',
              '      argb(palette.accent),\n      title,\n      aba === "backorder",\n    );\n  });'
            ),
            (
              '  aba: "corretiva" | "preventiva",\n) {',
              '  aba: "corretiva" | "preventiva" | "backorder",\n) {'
            ),
            (
              '    `programacao_${aba}_${slug || "todas_equipes"}_${generatedAt.toISOString().slice(0, 10)}.xlsx`,',
              '    `${aba === "backorder" ? "backorders" : `programacao_${aba}`}_${slug || "todas_equipes"}_${generatedAt.toISOString().slice(0, 10)}.xlsx`,'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Excel patch target not found:\n{old}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          # --- Corretiva Novo page ---
          path = Path('src/routes/_authenticated/corretiva-novo.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const backorderVisibleCount = useMemo(
    () =>
      osList.filter((os) => {
        const info =
          backorderMap.get(String(os.id ?? os.numero_os ?? "")) ?? getBackorderInfo(os);
        return info.isBackorder && !isCompletedStatus(os.status);
      }).length,
    [osList, backorderMap],
  );'''
          new = '''  const backorderExportRows = useMemo(
    () =>
      exportBaseRows.filter((os) => {
        const info =
          backorderMap.get(String(os.id ?? os.numero_os ?? "")) ?? getBackorderInfo(os);
        return info.isBackorder && !isCompletedStatus(os.status);
      }),
    [exportBaseRows, backorderMap],
  );

  const backorderVisibleCount = backorderExportRows.length;'''
          if old not in text:
            raise SystemExit('Backorder count block not found')
          text = text.replace(old, new, 1)

          marker = '''  const exportProgrammedExcel = async () => {'''
          handler = '''  const exportBackorderExcel = async () => {
    if (!backorderExportRows.length) {
      return toast.error("Nenhum Backorder aberto foi identificado para exportação.");
    }
    try {
      await generateProgramacaoExcel(
        backorderExportRows,
        "BACKORDERS · Todas as equipes",
        "backorder",
      );
      toast.success(
        `Planilha de Backorders gerada com ${backorderExportRows.length} chamado(s).`,
      );
    } catch (error) {
      console.error(error);
      toast.error("Erro ao gerar a planilha de Backorders.");
    }
  };

'''
          if marker not in text:
            raise SystemExit('Programmed export handler marker not found')
          text = text.replace(marker, handler + marker, 1)

          marker = '''          <DropdownMenu>
            <DropdownMenuTrigger asChild>'''
          button = '''          <Button
            variant="outline"
            size="sm"
            onClick={exportBackorderExcel}
            disabled={!backorderExportRows.length}
            className="gap-2 border-red-500/30 bg-red-500/[0.08] text-red-100 shadow-[0_8px_26px_rgba(127,29,29,0.10)] hover:border-red-400/45 hover:bg-red-500/[0.14] hover:text-white disabled:opacity-45"
            title="Baixar planilha exclusiva dos Backorders abertos"
          >
            <Archive className="h-4 w-4 text-red-400" />
            <span className="font-semibold">Planilha Backorders</span>
            <span className="inline-flex min-w-5 items-center justify-center rounded-md border border-red-300/10 bg-red-950/70 px-1.5 py-0.5 text-[10px] font-extrabold text-red-100">
              {backorderExportRows.length}
            </span>
          </Button>
'''
          if marker not in text:
            raise SystemExit('Export dropdown marker not found')
          text = text.replace(marker, button + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/lib/corretiva/programacao-excel.ts src/routes/_authenticated/corretiva-novo.tsx
          git commit -m "feat(corretiva): add dedicated Backorder spreadsheet export"
          git push origin HEAD:Apont-Auto
