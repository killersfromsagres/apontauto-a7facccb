name: Fix auth connection false positive

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/fix-auth-connection-error.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://fbhpdqykoptxnrbdcspr.supabase.co
      VITE_SUPABASE_PROJECT_ID: fbhpdqykoptxnrbdcspr
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_660hxNRSWPXuCne6oba5iQ_5DEZthmB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto

      - name: Apply login patch
        run: python .github/patch_auth_connection_error.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit implementation
        run: |
          if git diff --quiet -- src/routes/auth.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "OpenAI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/auth.tsx
          git commit -m "fix: evitar falso erro de conexão no login"
          git push origin HEAD:Apont-Auto
