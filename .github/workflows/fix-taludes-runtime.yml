name: Fix Taludes runtime

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/scripts/fix_taludes_runtime.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Apply runtime fixes
        run: python .github/scripts/fix_taludes_runtime.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/components/taludes/polygon-editor-pro.tsx src/routes/_authenticated/taludes.tsx src/lib/weather/open-meteo.ts src/routes/api/public/clima-forecast.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(taludes): prevent map freeze and restore weather"
          git push origin Apont-Auto
