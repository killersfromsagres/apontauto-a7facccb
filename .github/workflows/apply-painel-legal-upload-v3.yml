name: Apply Painel Legal Upload V3

on:
  push:
    branches:
      - fix/painel-legal-certificates-upload-v3

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[painel-legal-upload-v3-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/painel-legal-certificates-upload-v3
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply fix
        run: python3 .github/scripts/apply_painel_legal_upload_v3.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/legal-items.ts src/components/legal/legal-attachments-modal.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: corrige upload de certificados do Painel Legal [painel-legal-upload-v3-done]"
          git push origin HEAD:fix/painel-legal-certificates-upload-v3
