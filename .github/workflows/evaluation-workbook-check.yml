name: Evaluation workbook check

on:
  push:
    branches:
      - feat/avaliacao-chamados-planilha-privada

permissions:
  contents: read

concurrency:
  group: evaluation-workbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-evaluation-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run evaluation workbook tests
        run: npx vitest run src/features/avaliacao-chamados/lib/evaluation-workbook.test.ts
