name: Refine legal certificate storage and history

on:
  push:
    branches:
      - Apont-Auto
    paths:
      - .github/workflows/refine-legal-certificates.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Apont-Auto
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply certificate refinement
        run: python .github/scripts/refine_legal_certificates.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Commit certificate refinement
        run: |
          git config user.name "Dev Gabriel Vitor"
          git config user.email "contatoswampzin@gmail.com"
          git add src/lib/legal-items.ts src/components/legal/legal-attachments-modal.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(legal): separate current and historical certificates"
          git push origin HEAD:Apont-Auto
