<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Apont Auto — Prisma4</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon.png" width="32" height="32" alt="" />
      <div>
        <h1>Apont Auto</h1>
        <p>Automação Prisma4</p>
      </div>
    </header>

    <section class="card">
      <h2>Credenciais</h2>
      <label>Usuário<input id="usuario" type="text" placeholder="ex: 436057" autocomplete="off" /></label>
      <label>Senha<input id="senha" type="password" placeholder="••••••" autocomplete="off" /></label>
      <button id="salvarCreds" class="ghost">Salvar credenciais</button>
      <p class="hint">Salvo apenas neste navegador (<code>chrome.storage.local</code>).</p>
    </section>

    <section class="card">
      <h2>Lote</h2>
      <div class="row">
        <button id="importarBtn">Importar JSON</button>
        <input id="importInput" type="file" accept=".json,application/json,text/plain,.txt" hidden />
        <button id="limparBtn" class="ghost">Limpar</button>
      </div>
      <div id="loteInfo" class="lote-info">Nenhum lote carregado.</div>
    </section>

    <section class="card">
      <h2>Execução</h2>
      <div class="row">
        <button id="iniciarBtn" class="primary">▶ Iniciar automação</button>
        <button id="pausarBtn" class="ghost" disabled data-state="running">⏸ Pausar</button>
        <button id="pararBtn" class="ghost" disabled>⏹ Parar</button>
        <button id="retomarBtn" class="ghost" disabled>↻ Retomar de onde parou</button>
      </div>
      <progress id="progresso" value="0" max="100"></progress>
      <div id="statusLine">Aguardando…</div>
    </section>

    <section class="card">
      <h2>Log</h2>
      <pre id="log" class="log"></pre>
      <div class="row">
        <button id="exportarLog" class="ghost">Exportar JSON</button>
        <button id="exportarCsv" class="ghost">Exportar CSV</button>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
