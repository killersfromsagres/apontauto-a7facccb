<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Apont Auto — Painel Prisma</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon128.png" alt="" width="28" height="28" />
      <div>
        <h1>Painel Prisma</h1>
        <p id="statusBadge" class="badge off">Desconectado</p>
      </div>
    </header>

    <section id="setup">
      <label>URL do Supabase</label>
      <input id="supabaseUrl" placeholder="https://xxxxx.supabase.co" />

      <label>Chave anon</label>
      <input id="anonKey" placeholder="sb_publishable_..." />

      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com" />

      <label>Senha</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

      <label>Padrão de URL do Prisma</label>
      <input id="prismaUrlPattern" placeholder="https://*.cimogps.com.br/*" value="https://*.cimogps.com.br/*" />

      <button id="btnLogin" class="primary">Conectar</button>
    </section>

    <section id="controls" hidden>
      <div class="row">
        <span id="userInfo" class="muted"></span>
        <button id="btnLogout" class="ghost small">Sair</button>
      </div>
      <button id="btnToggle" class="primary">Ativar automação</button>
      <button id="btnCiclo" class="ghost">Verificar lotes agora</button>
      <p class="hint">Deixe uma aba do Prisma aberta e logada no mesmo navegador. A extensão checa por lotes pendentes a cada 30s.</p>
    </section>

    <p id="status" class="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
