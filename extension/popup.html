<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Apont Auto — Automação Prisma4</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 340px; margin: 0; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #0a0a0c; color: #f4f4f5;
      }
      h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: 0.05em; text-transform: uppercase; }
      .sub { font-size: 11px; color: #a1a1aa; margin-bottom: 14px; }
      label { display: block; font-size: 11px; color: #a1a1aa; margin: 10px 0 4px; }
      input, button {
        width: 100%; padding: 8px 10px; border-radius: 8px;
        border: 1px solid #27272a; background: #18181b; color: #fafafa; font-size: 12px;
      }
      button { margin-top: 10px; cursor: pointer; background: linear-gradient(135deg,#10b981,#059669); border: 0; font-weight: 600; }
      button.secondary { background: #27272a; margin-top: 6px; }
      .status { margin-top: 12px; padding: 10px; border-radius: 8px; background: #18181b; border: 1px solid #27272a; font-size: 11px; line-height: 1.5; }
      .queue { margin-top: 10px; max-height: 160px; overflow: auto; }
      .item { padding: 6px 8px; border: 1px solid #27272a; border-radius: 8px; margin-bottom: 6px; font-size: 11px; }
      .pill { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-right: 4px; }
      .pending { background: #78350f33; color: #fbbf24; }
      .done { background: #14532d33; color: #4ade80; }
      .err { background: #7f1d1d33; color: #f87171; }
      hr { border: 0; border-top: 1px solid #27272a; margin: 12px 0 4px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    </style>
  </head>
  <body>
    <h1>Apont Auto · Prisma4</h1>
    <div class="sub">Automação 100% navegador · v1.0.0</div>

    <label for="user">Usuário Prisma4</label>
    <input id="user" placeholder="ex.: 969717" />
    <label for="pass">Senha</label>
    <input id="pass" type="password" placeholder="••••••" />
    <button id="save">Salvar credenciais</button>

    <hr />
    <div class="row2">
      <button id="open" class="secondary">Abrir Prisma4</button>
      <button id="clear" class="secondary">Limpar fila</button>
    </div>

    <div class="status" id="status">—</div>
    <div class="queue" id="queue"></div>

    <script src="popup.js"></script>
  </body>
</html>
